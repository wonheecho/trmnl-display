<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1872">
  <title>조원희 교수 시간표 (2026 2학기)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1872px;
      height: 1404px;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      width: 1872px;
      height: 1404px;
      padding: 16px 20px 12px;
      gap: 10px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 20px;
      border-bottom: 3px solid #000;
      padding-bottom: 10px;
    }
    .header-title {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-size: 38px;
      color: #000;
    }

    /* ── Main content ── */
    .content {
      display: flex;
      flex: 1;
      gap: 16px;
      min-height: 0;
    }

    /* ── Calendar (left) ── */
    .calendar {
      flex: 0 0 1220px;
      display: flex;
      flex-direction: column;
    }

    .cal-header {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      border-bottom: 2px solid #000;
      margin-bottom: 3px;
    }
    .cal-header .day-label {
      font-size: 38px;
      font-weight: 700;
      text-align: center;
      padding: 2px 0 6px;
    }
    .cal-header .day-label.today {
      background: #000;
      color: #fff;
      border-radius: 6px;
    }

    .cal-body {
      flex: 1;
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      grid-template-rows: repeat(10, 1fr);
      border: 2px solid #000;
      border-right: none;
      border-bottom: none;
    }

    .time-label {
      font-size: 26px;
      color: #000;
      text-align: right;
      padding-right: 6px;
      padding-top: 3px;
      border-right: 2px solid #000;
      border-bottom: 1px solid #ccc;
    }

    .cell {
      border-right: 1px solid #000;
      border-bottom: 1px solid #ccc;
      position: relative;
    }

    /* ── Events ── */
    .event {
      position: absolute;
      left: 2px;
      right: 2px;
      border-radius: 4px;
      padding: 4px 6px;
      font-weight: 500;
      line-height: 1.3;
      overflow: hidden;
      z-index: 2;
    }
    .event-class { background: #000; color: #fff; }
    .event-office { background: #fff; color: #000; border: 2px solid #000; }
    .event-name {
      font-weight: 700;
      font-size: 22px;
      white-space: nowrap;
      overflow: visible;
      word-break: keep-all;
      text-align: center;
    }
    .event-time { font-size: 24px; text-align: center; }

    /* ── Right panel ── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── QR section ── */
    .qr-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
      border-radius: 8px;
      padding: 16px;
      gap: 10px;
    }
    .qr-name-en {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
    }
    .qr-name-kr {
      font-size: 34px;
      font-weight: 700;
      text-align: center;
    }
    .qr-divider {
      width: 80%;
      border: none;
      border-top: 2px solid #000;
      margin: 2px 0;
    }
    #qrcode canvas, #qrcode img,
    #qrcode-signup canvas, #qrcode-signup img{
      width: 280px !important;
      height: 280px !important;
    }
    .qr-caption-en {
      font-size: 26px;
      text-align: center;
    }
    .qr-caption-kr {
      font-size: 26px;
      text-align: center;
    }

    /* ── Weather / date section ── */
    .weather-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
      border-radius: 8px;
      padding: 16px;
      gap: 8px;
    }
    .datetime-date {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
    }
    .weather-divider {
      width: 80%;
      border: none;
      border-top: 2px solid #000;
      margin: 4px 0;
    }
    .weather-temp {
      font-size: 64px;
      font-weight: 700;
      text-align: center;
    }
    .weather-condition {
      font-size: 34px;
      text-align: center;
    }
    .weather-detail {
      font-size: 28px;
      text-align: center;
    }
    .weather-loading {
      font-size: 28px;
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <span class="header-title">조원희 교수 시간표 (2026 2학기)</span>
    <span class="header-sub">연세대학교 사학과</span>
  </div>

  <div class="content">

    <!-- ── Calendar ── -->
    <div class="calendar">
      <div class="cal-header">
        <div></div>
        <div class="day-label" id="lbl-mon">월</div>
        <div class="day-label" id="lbl-tue">화</div>
        <div class="day-label" id="lbl-wed">수</div>
        <div class="day-label" id="lbl-thu">목</div>
        <div class="day-label" id="lbl-fri">금</div>
      </div>
      <div class="cal-body">

        <div class="time-label">9시</div>
        <div class="cell" id="r0c1"></div><div class="cell" id="r0c2"></div>
        <div class="cell" id="r0c3"></div><div class="cell" id="r0c4"></div><div class="cell" id="r0c5"></div>

        <div class="time-label">10시</div>
        <div class="cell" id="r1c1"></div><div class="cell" id="r1c2"></div>
        <div class="cell" id="r1c3"></div><div class="cell" id="r1c4"></div><div class="cell" id="r1c5"></div>

        <div class="time-label">11시</div>
        <div class="cell" id="r2c1"></div><div class="cell" id="r2c2"></div>
        <div class="cell" id="r2c3"></div><div class="cell" id="r2c4"></div><div class="cell" id="r2c5"></div>

        <div class="time-label">12시</div>
        <div class="cell" id="r3c1"></div><div class="cell" id="r3c2"></div>
        <div class="cell" id="r3c3"></div><div class="cell" id="r3c4"></div><div class="cell" id="r3c5"></div>

        <div class="time-label">13시</div>
        <div class="cell" id="r4c1"></div><div class="cell" id="r4c2"></div>
        <div class="cell" id="r4c3"></div><div class="cell" id="r4c4"></div><div class="cell" id="r4c5"></div>

        <div class="time-label">14시</div>
        <div class="cell" id="r5c1"></div><div class="cell" id="r5c2"></div>
        <div class="cell" id="r5c3"></div><div class="cell" id="r5c4"></div><div class="cell" id="r5c5"></div>

        <div class="time-label">15시</div>
        <div class="cell" id="r6c1"></div><div class="cell" id="r6c2"></div>
        <div class="cell" id="r6c3"></div><div class="cell" id="r6c4"></div><div class="cell" id="r6c5"></div>

        <div class="time-label">16시</div>
        <div class="cell" id="r7c1"></div><div class="cell" id="r7c2"></div>
        <div class="cell" id="r7c3"></div><div class="cell" id="r7c4"></div><div class="cell" id="r7c5"></div>

        <div class="time-label">17시</div>
        <div class="cell" id="r8c1"></div><div class="cell" id="r8c2"></div>
        <div class="cell" id="r8c3"></div><div class="cell" id="r8c4"></div><div class="cell" id="r8c5"></div>

        <div class="time-label">18시</div>
        <div class="cell" id="r9c1"></div><div class="cell" id="r9c2"></div>
        <div class="cell" id="r9c3"></div><div class="cell" id="r9c4"></div><div class="cell" id="r9c5"></div>

      </div>
    </div>

    <!-- ── Right panel ── -->
    <div class="right-panel">

      <div class="qr-section">
        <div class="qr-name-en">Professor Wonhee Cho</div>
        <div class="qr-name-kr">조원희 교수</div>
        <hr class="qr-divider">
        <div id="qrcode"></div>
        <div class="qr-caption-en">Professor Cho's Homepage</div>
        <div class="qr-caption-kr">조원희 교수 홈페이지</div>
      </div>

      <div class="qr-section">
        <div class="qr-name-en">Office Hour Sign-up</div>
        <div class="qr-name-kr">학생면담 신청</div>
        <hr class="qr-divider">
        <div id="qrcode-signup"></div>
        <div class="qr-caption-en">Scan to book a meeting</div>
        <div class="qr-caption-kr">QR코드를 스캔하여 예약하세요</div>
      </div>

    </div>
  </div>
</div>

<script>
// ── Highlight today (Korea time) ──
const nowKR = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
const dayMap = {1:'lbl-mon',2:'lbl-tue',3:'lbl-wed',4:'lbl-thu',5:'lbl-fri'};
if(dayMap[nowKR.getDay()]) document.getElementById(dayMap[nowKR.getDay()]).classList.add('today');

// ── Place event ──
function placeEvent(col, startHour, endHour, label, timeStr, type) {
  const startRow = startHour - 9;
  const rowSpan  = endHour - startHour;
  const anchor   = document.getElementById(`r${startRow}c${col}`);
  if (!anchor) return;
  const div = document.createElement('div');
  div.className = `event event-${type}`;
  div.innerHTML = `<div class="event-name">${label}</div><div class="event-time">${timeStr}</div>`;
  anchor.appendChild(div);
  requestAnimationFrame(() => {
    const cellH = anchor.getBoundingClientRect().height;
    div.style.top = '2px';
    div.style.height = (cellH * rowSpan - 4) + 'px';
  });
}

// 북방민족사의 제문제 (대학원) — 수 15–18
placeEvent(3, 15, 18, '북방민족사의 제문제', '15–18시 (대학원)', 'class');

// 동양사입문 (학부) — 화 15–16, 목 16–18
placeEvent(2, 15, 16, '동양사입문', '15–16시', 'class');
placeEvent(4, 16, 18, '동양사입문', '16–18시', 'class');

// 오피스아워 (Office Hour) — 목 14–16
placeEvent(4, 14, 16, 'Office Hour', '14–16시', 'office');

// ── QR Code ──
new QRCode(document.getElementById("qrcode"), {
  text: "https://wonheecho.net",
  width: 280,
  height: 280,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});

// ── Sign-up QR Code ──
new QRCode(document.getElementById("qrcode-signup"), {
  text: "https://calendly.com/nomadism/new-meeting",
  width: 280,
  height: 280,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
